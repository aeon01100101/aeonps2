apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

def keystorePropsFile = rootProject.file("../signing/keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace = "com.aeonps2.firetv"
    compileSdk = 35
    ndkVersion = "26.3.11579264"

    defaultConfig {
        applicationId = "com.aeonps2.firetv"
        minSdk = 24
        targetSdk = 35
        versionCode = 3
        versionName = "1.0.2"

        externalNativeBuild {
            ndkBuild {
                // The bridge builds for both ABIs. The PCSX2 engine
                // (PCEE2) only exists for arm64; 32-bit devices run the
                // Play! fallback core shipped in jniLibs/armeabi-v7a.
                abiFilters("arm64-v8a", "armeabi-v7a")
            }
        }
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile = rootProject.file(keystoreProps["storeFile"])
                storePassword = keystoreProps["storePassword"]
                keyAlias = keystoreProps["keyAlias"]
                keyPassword = keystoreProps["keyPassword"]
                // v1.0.2: v1 signature ON too. v1.0.1 was v2-only, which
                // older Android package managers can refuse; both
                // schemes now sign the release build.
                v1SigningEnabled = true
                v2SigningEnabled = true
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = false
            shrinkResources = false
        }
    }

    // Legacy native extraction: the app extracts its .so files at install
    // time. This removes any Fire OS native-extraction/alignment edge —
    // the merged manifest carries android:extractNativeLibs="true".
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    externalNativeBuild {
        ndkBuild {
            path = file("src/main/jni/Android.mk")
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation("androidx.leanback:leanback:1.0.0")
}
